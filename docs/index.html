<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-200 Prep — Microsoft Azure AI Cloud Developer Associate</title>
  <link rel="stylesheet" href="style.css?v=2.0.1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="header-top">
      <a href="#today" class="brand-section">
        <span class="brand-badge">AI-200</span>
        <span class="brand-title">Study Hub</span>
      </a>

      <!-- Global Search Box with Key Hint -->
      <div class="header-search">
        <span class="header-search-icon">🔍</span>
        <input type="text" id="global-search-input" placeholder="Cari catatan, kartu, lab, atau keputusan..." autocomplete="off">
        <span class="search-kbd-hint" title="Tekan / untuk mencari langsung"><kbd>/</kbd></span>
      </div>

      <!-- Quick Action Buttons, Theme Toggle, & Status -->
      <div class="header-actions">
        <button class="btn-quick" onclick="App.openQuickLabModal()" title="Catat Lab Cepat (Alt+L)">
          🧪 <span class="btn-text-desktop">Lab</span> <span class="kbd-shortcut">Alt+L</span>
        </button>

        <button class="btn-quick" onclick="App.openQuickCardModal()" title="Tambah Kartu Hafalan Cepat (Alt+N)">
          💡 <span class="btn-text-desktop">Kartu</span> <span class="kbd-shortcut">Alt+N</span>
        </button>

        <!-- Keyboard Shortcuts Help Button -->
        <button class="btn-quick" onclick="App.openShortcutsModal()" title="Daftar Pintasan Keyboard Lengkap (Tekan ?)">
          ⌨️ <span class="kbd-shortcut">?</span>
        </button>

        <!-- Theme Toggle Button -->
        <button id="theme-toggle-btn" class="btn-quick" onclick="App.toggleTheme()" title="Ganti Mode Terang / Gelap">
          ☀️
        </button>

        <!-- Multi-device Sync Pull Button -->
        <button id="header-sync-btn" class="btn-quick" onclick="App.syncData()" title="Tarik data terbaru dari GitHub">
          <span id="sync-spinner-icon" style="display: inline-block;">🔄</span> <span class="btn-text-desktop">Sinkron</span>
        </button>

        <!-- Save Indicator -->
        <div id="save-status-pill" class="status-pill status-saved" onclick="Store.flush('manual save: sync all dirty files')" title="Klik untuk menyimpan ke repositori sekarang">
          <span class="status-dot"></span>
          <span id="save-status-label">Tersimpan</span>
        </div>
      </div>
    </div>

    <!-- 4 Main Nav Tabs + Overflow Menu (A1) -->
    <nav class="nav-scroll">
      <a href="#today" class="nav-link active" id="nav-today">📅 Hari Ini</a>
      <a href="#learn" class="nav-link" id="nav-learn">🎯 Belajar</a>
      <a href="#practice" class="nav-link" id="nav-practice">⚡ Latihan</a>
      <a href="#notes" class="nav-link" id="nav-notes">📝 Catatan</a>
      <div class="nav-overflow-container" style="position: relative; display: inline-flex; align-items: center;">
        <button id="nav-overflow-btn" class="nav-link btn-overflow" onclick="App.toggleNavOverflow(event)" title="Menu Lainnya" style="background: transparent; border: none; cursor: pointer; font-size: 1.1rem; line-height: 1; padding: 0.45rem 0.65rem;">
          ⋯
        </button>
        <div id="nav-overflow-menu" class="nav-overflow-dropdown" style="display: none; position: absolute; right: 0; top: 100%; min-width: 170px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); z-index: 1000; padding: 0.35rem 0; margin-top: 0.25rem;">
          <a href="#resources" class="overflow-item" onclick="App.closeNavOverflow()">📚 Sumber</a>
          <a href="#stats" class="overflow-item" onclick="App.closeNavOverflow()">📊 Statistik</a>
          <a href="#settings" class="overflow-item" onclick="App.closeNavOverflow()">⚙️ Pengaturan</a>
          <a href="#diagnostics" class="overflow-item" onclick="App.closeNavOverflow()">🩺 Diagnostik</a>
        </div>
      </div>
    </nav>
  </header>

  <!-- Main View Container -->
  <main id="main-content" class="app-main">
    <!-- Rendered dynamically by Router -->
  </main>

  <!-- Global Modal Dialog Container -->
  <div id="global-modal-backdrop" class="modal-backdrop" onclick="if (event.target === this) App.closeModal()">
    <div id="global-modal-content" class="modal-content">
      <!-- Injected dynamically by App / Page modals -->
    </div>
  </div>

  <!-- Floating Toast Notifications Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Celebration Confetti Canvas Overlay -->
  <canvas id="confetti-canvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999;"></canvas>

  <!-- Vendor Libraries (Zero npm / Zero CDN) -->
  <script src="vendor/marked.min.js?v=2.0.1"></script>

  <!-- Global Utility -->
  <script>
    window.escapeHtml = function(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    };
  </script>

  <!-- Application Modules -->
  <script src="js/github.js?v=2.0.1"></script>
  <script src="js/store.js?v=2.0.1"></script>
  <script src="js/srs.js?v=2.0.1"></script>
  
  <!-- Pages -->
  <script src="js/pages/today.js?v=2.0.1"></script>
  <script src="js/pages/plan.js?v=2.0.1"></script>
  <script src="js/pages/learn.js?v=2.0.1"></script>
  <script src="js/pages/resources.js?v=2.0.1"></script>
  <script src="js/pages/notes.js?v=2.0.1"></script>
  <script src="js/pages/drill.js?v=2.0.1"></script>
  <script src="js/pages/exams.js?v=2.0.1"></script>
  <script src="js/pages/decisions.js?v=2.0.1"></script>
  <script src="js/pages/practice.js?v=2.0.1"></script>
  <script src="js/pages/stats.js?v=2.0.1"></script>
  <script src="js/pages/settings.js?v=2.0.1"></script>
  <script src="js/pages/diagnostics.js?v=2.0.1"></script>
  
  <!-- Bootstrap -->
  <script src="js/app.js?v=2.0.1"></script>
</body>
</html>
